[package]
name         = "ethos-zero"
version      = "2.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/ethos-zero"
description  = "Ethos schema language version zero: reads ethos, emits Rust."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "ethos_zero"
path = "src/lib.rs"

[[bin]]
name = "ethos-zero"
path = "src/main.rs"

[dependencies]
protos  = { git = "https://github.com/LiGoldragon/protos",  rev = "c5594f9d6f73" }
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "2c2e2073fd34" }
quote       = "1"
proc-macro2 = "1"
syn         = { version = "3", features = ["full"] }

[[test]]
name = "ethos"
path = "tests/ethos.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
