[package]
name         = "ethos-monolith"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/ethos-monolith"
description  = "Reads Ethos text, emits Rust (signal.rs, nexus.rs, sema.rs) per component."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "ethos_monolith"
path = "src/lib.rs"

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "8a056423e4b69011b17c460d2eb7e668c3b04af7" }
thiserror = "2"

[dev-dependencies]
syn = { version = "3", features = ["full"] }
unicode-ident = "1"

[[test]]
name = "generate"
path = "tests/generate.rs"

[[test]]
name = "interface_fixture"
path = "tests/interface_fixture.rs"

[[test]]
name = "architecture_guards"
path = "tests/architecture_guards.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
