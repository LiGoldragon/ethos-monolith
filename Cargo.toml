[package]
name         = "ethos-zero"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/ethos-zero"
description  = "Ethos File anatomy and structural Rust emission."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "ethos_zero"
path = "src/lib.rs"

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "7e2bba7d48c62de53b3f93cb6053a490bbd6cf3b" }
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "ffb0ffa316285ab56e50fbc035cb8c14380f4665" }
quote = "1"
proc-macro2 = "1"
syn = { version = "3", features = ["full"] }
thiserror = "2"

[[test]]
name = "file_contract"
path = "tests/file_contract.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
