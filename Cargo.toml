[package]
name         = "ethos-zero"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/ethos-zero"
description  = "Ethos File anatomy and structural Rust emission."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "ethos_zero"
path = "src/lib.rs"

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "2f605fd689679a24e4ef83a643a2cd066cb12186" }
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "8b17abc5296e0d41b6a4adf45f71eb9a90f7241b" }
quote = "1"
proc-macro2 = "1"
syn = { version = "3", features = ["full"] }
thiserror = "2"

[dev-dependencies]
proptest = "1.6"

[[test]]
name = "file_contract"
path = "tests/file_contract.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
