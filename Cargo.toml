[package]
name         = "ethos-monolith"
version      = "0.5.5"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/ethos-monolith"
description  = "Reads signal Ethos text and emits signal.rs for wire consumers."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "ethos_monolith"
path = "src/lib.rs"

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3b190f9fc2c2a074ceeb6ababfea89e3dd504996" }
syn = { version = "3", features = ["full"] }
thiserror = "2"

[dev-dependencies]
unicode-ident = "1"

[[test]]
name = "generate"
path = "tests/generate.rs"

[[test]]
name = "interface_fixture"
path = "tests/interface_fixture.rs"

[[test]]
name = "architecture_guards"
path = "tests/architecture_guards.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
